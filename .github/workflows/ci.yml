name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  banned-vocab:
    name: banned-vocab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check banned vocabulary
        run: |
          if grep -riE "sovereign|SYS\.INIT|secure enclave" app components lib content; then
            echo "::error::Banned vocabulary found"
            exit 1
          else
            echo "No banned vocabulary found"
          fi

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Direct gitleaks binary instead of gitleaks-action@v2: the action exits 1
      # on branch pushes even with zero findings (its git-range logic is flaky).
      # A working-tree scan is deterministic — exits nonzero only on a real leak.
      - name: Run gitleaks
        run: |
          VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --verbose

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Gate on CRITICAL. The remaining HIGH advisories are all against Next.js
      # 14.2.x and target middleware / rewrites / the image optimizer — none of
      # which this site uses (no middleware, no rewrites, images.unoptimized,
      # no remotePatterns), so they are not exploitable here. They are only
      # patched in Next 15; that major migration is tracked as a post-launch
      # item (see docs/LAUNCH.md) rather than rushed at launch. HIGH is printed
      # for visibility but does not block.
      - run: npm audit --omit=dev --audit-level=high || true
      - run: npm audit --omit=dev --audit-level=critical

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Server startup is configured in lighthouserc.json (ci.collect.*).
      # lighthouse-ci-action@v12 dropped the startServerCommand inputs; passing
      # them made Chrome load an error page and fail. Config-file form is correct.
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true
